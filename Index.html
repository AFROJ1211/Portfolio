<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - AFROJ</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        /* --- Design System Variables --- */
        :root {
            --primary-color: #6842EF;
            --primary-light: #F4F1FE;
            --primary-hover: #5534cc;
            --bg-main: #F4F5F7;
            --bg-card: #FFFFFF;
            --bg-input: #F9FAFB;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border-light: #E5E7EB;
            --danger-color: #EF4444;
            --danger-bg: #FEF2F2;
        }

        /* --- Base Reset --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* --- Ambient Background Glows (Premium Feel) --- */
        .bg-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.6;
        }
        
        .glow-1 {
            background: rgba(104, 66, 239, 0.3);
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
        }

        .glow-2 {
            background: rgba(59, 130, 246, 0.2);
            width: 500px;
            height: 500px;
            bottom: -150px;
            right: -150px;
        }

        /* --- Login Card Container --- */
        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .login-card {
            background-color: var(--bg-card);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0,0,0,0.05);
            border: 1px solid var(--border-light);
            padding: 48px 40px 56px 40px;
            backdrop-filter: blur(10px);
        }

        /* --- Branding Header --- */
        .brand-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .brand-header h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        /* --- Error Message Box --- */
        .error-message {
            display: none;
            background-color: var(--danger-bg);
            color: var(--danger-color);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 24px;
        }

        /* --- Form Elements --- */
        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        /* Input with Icons */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.left-icon {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 20px;
            pointer-events: none;
            transition: color 0.2s;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-main);
            background-color: var(--bg-input);
            outline: none;
            transition: all 0.2s;
        }

        .form-control::placeholder {
            color: #9CA3AF;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 4px var(--primary-light);
        }
        .form-control:focus + i.left-icon,
        .input-wrapper:focus-within i.left-icon {
            color: var(--primary-color);
        }

        /* Password Reveal Toggle */
        .password-toggle {
            position: absolute;
            right: 16px;
            color: var(--text-muted);
            font-size: 20px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        .password-toggle:hover {
            color: var(--text-main);
        }

        /* --- Options Row --- */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-main);
            font-weight: 500;
        }

        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .forgot-password {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .forgot-password:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        /* --- Submit Button --- */
        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(104, 66, 239, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(104, 66, 239, 0.3);
        }

        .btn-submit:disabled {
            background-color: #9CA3AF;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <!-- Ambient Background Lights -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div class="login-wrapper">
        <div class="login-card">
            
            <div class="brand-header">
                <h1>Welcome back AFROJ</h1>
            </div>

            <!-- Error message container -->
            <div id="errorMessage" class="error-message"></div>

            <!-- Added onsubmit="return false;" to prevent the browser from refreshing the page -->
            <form id="loginForm" onsubmit="return false;">
                
                <!-- Email Input -->
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="emailInput" class="form-control" placeholder="admin@portfolio.com" required>
                        <i class="ph ph-envelope-simple left-icon"></i>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="passwordInput" class="form-control" placeholder="••••••••" required>
                        <i class="ph ph-lock left-icon"></i>
                        <button type="button" class="password-toggle" id="toggleBtn" aria-label="Toggle password visibility">
                            <i class="ph ph-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" checked>
                        Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <!-- Submit -->
                <button type="submit" id="submitBtn" class="btn-submit">
                    Sign In <i class="ph ph-arrow-right"></i>
                </button>
            </form>

        </div>
    </div>

    <!-- Firebase Integration -->
    <script type="module">
        // 1. Import Firebase Core and Auth
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // 2. Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDhA-AAzP3kf7Zn0c98k0ozlkqk1aST-x0",
            authDomain: "planning-with-ai-592ee.firebaseapp.com",
            projectId: "planning-with-ai-592ee",
            storageBucket: "planning-with-ai-592ee.firebasestorage.app",
            messagingSenderId: "321067926334",
            appId: "1:321067926334:web:e9cb315d9eae763e0e626f"
        };

        // 3. Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // --- Bulletproof Redirect: Instantly fires if user is recognized ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Instantly redirects to the Home page
                window.location.replace("https://admin.rojz.in/Home.html");
            }
        });

        // --- DOM Elements ---
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const submitBtn = document.getElementById('submitBtn');
        const errorMessage = document.getElementById('errorMessage');
        
        // --- Password Visibility Toggle Logic ---
        const toggleBtn = document.getElementById('toggleBtn');
        const toggleIcon = document.getElementById('toggleIcon');

        toggleBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('ph-eye');
                toggleIcon.classList.add('ph-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('ph-eye-slash');
                toggleIcon.classList.add('ph-eye');
            }
        });

        // --- Handle Form Submission (Firebase Login) ---
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Stop page reload explicitly
            
            // Hide previous errors
            errorMessage.style.display = 'none';
            errorMessage.textContent = '';

            // Get credentials
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            // Change button state to simulate loading
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Authenticating...';
            submitBtn.disabled = true;

            try {
                // Attempt Firebase Sign In
                await signInWithEmailAndPassword(auth, email, password);
                
                // If successful, onAuthStateChanged (above) will catch it and redirect.
                // We update the UI to show success just in case there is a tiny delay.
                submitBtn.innerHTML = '<i class="ph ph-check-circle"></i> Success!';
                submitBtn.style.backgroundColor = "#10B981"; // Success Green

            } catch (error) {
                // Log to console for debugging
                console.error("Login failed:", error.code, error.message);
                
                // Format friendly error messages based on Firebase codes
                let friendlyMessage = "An error occurred during login. Please try again.";
                
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    friendlyMessage = "Invalid email or password. Please try again.";
                } else if (error.code === 'auth/too-many-requests') {
                    friendlyMessage = "Too many failed login attempts. Please try again later.";
                } else if (error.code === 'auth/invalid-email') {
                    friendlyMessage = "Please enter a valid email address.";
                }

                // Display Error
                errorMessage.textContent = friendlyMessage;
                errorMessage.style.display = 'block';

                // Reset Button
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
